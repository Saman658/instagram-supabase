<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup - Instagram Mini App</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="navbar">
        <h1>Instagram</h1>

        <nav aria-label="Primary navigation">
            <a href="../index.html">Home</a>
        </nav>
    </header>

    <main class="container">
        <section class="login-section" aria-labelledby="signup-heading">
            <h2 id="signup-heading">Sign Up</h2>

            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" placeholder="Choose a username" required minlength="3" maxlength="30">
                </div>

                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                </div>

                <button type="submit">Sign Up</button>
            </form>

            <p id="signup-message" class="login-message" role="status" aria-live="polite"></p>

            <p class="login-hint">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="signup.js"></script>

</body>

</html>
